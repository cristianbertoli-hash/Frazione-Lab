name: Build MEDLAB Care Android v0.1

on:
  workflow_dispatch:
  push:
    branches: ["ci/medlab-care-v0.1"]
    paths:
      - "medlab-care-build/**"
      - "!medlab-care-build/releases/**"
      - ".github/workflows/medlab-care-build.yml"

concurrency:
  group: medlab-care-v01-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run core tests
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/medlab-tests && mkdir -p /tmp/medlab-tests
          javac -encoding UTF-8 -d /tmp/medlab-tests \
            medlab-care-build/src/io/braincore/medlabcare/TriageEngine.java \
            medlab-care-build/src/io/braincore/medlabcare/MessageComposer.java \
            medlab-care-build/test/io/braincore/medlabcare/TriageEngineTest.java
          java -cp /tmp/medlab-tests io.braincore.medlabcare.TriageEngineTest

      - name: Verify privacy manifest
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -q "android.permission.INTERNET" medlab-care-build/AndroidManifest.xml
          ! grep -q "android.permission.READ_CONTACTS" medlab-care-build/AndroidManifest.xml
          ! grep -q "android.permission.CALL_PHONE" medlab-care-build/AndroidManifest.xml

      - name: Build and sign APK
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT="$GITHUB_WORKSPACE/medlab-care-build"
          BUILD="$PROJECT/.build"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          OUT="$GITHUB_WORKSPACE/MEDLAB-Care-v0.1-debug.apk"
          rm -rf "$BUILD" && mkdir -p "$BUILD"/{classes,dex}

          "$BT/aapt2" link \
            -o "$BUILD/resources.apk" \
            -I "$ANDROID_JAR" \
            --manifest "$PROJECT/AndroidManifest.xml" \
            --min-sdk-version 26 \
            --target-sdk-version 36 \
            --auto-add-overlay

          mapfile -t SOURCES < <(find "$PROJECT/src" -type f -name '*.java' | sort)
          javac --release 17 -encoding UTF-8 -cp "$ANDROID_JAR" -d "$BUILD/classes" "${SOURCES[@]}"
          jar cf "$BUILD/classes.jar" -C "$BUILD/classes" .
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --output "$BUILD/dex" "$BUILD/classes.jar"

          cp "$BUILD/resources.apk" "$BUILD/unsigned.apk"
          (cd "$BUILD/dex" && zip -q -0 "$BUILD/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$BUILD/unsigned.apk" "$BUILD/aligned.apk"

          keytool -genkeypair -noprompt \
            -keystore "$BUILD/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=MEDLAB Care Test,O=BrainCore,C=IT" \
            -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1

          cp "$BUILD/aligned.apk" "$OUT"
          "$BT/apksigner" sign \
            --ks "$BUILD/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$OUT"

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="$GITHUB_WORKSPACE/MEDLAB-Care-v0.1-debug.apk"
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.braincore.medlabcare'" /tmp/badging.txt
          grep -F "application: label='MEDLAB Care'" /tmp/badging.txt
          unzip -l "$APK" | grep -F "classes.dex"
          sha256sum "$APK" | tee /tmp/SHA256SUMS
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEDLAB-Care-v0.1-debug
          path: MEDLAB-Care-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish verified APK as base64 for chat handoff
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p medlab-care-build/releases
          base64 -w 76 MEDLAB-Care-v0.1-debug.apk > medlab-care-build/releases/MEDLAB-Care-v0.1-debug.apk.b64
          sha256sum MEDLAB-Care-v0.1-debug.apk > medlab-care-build/releases/MEDLAB-Care-v0.1-debug.sha256.txt
          cp /tmp/apksigner.txt medlab-care-build/releases/apksigner-verify.txt
          cp /tmp/badging.txt medlab-care-build/releases/badging.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medlab-care-build/releases/
          git diff --cached --quiet && exit 0
          git commit -m "build: publish verified MEDLAB Care v0.1 APK"
          git push origin HEAD:${GITHUB_REF_NAME}
